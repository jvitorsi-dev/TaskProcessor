name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore TaskProcessor.sln

      - name: Compilar solução
        run: dotnet build TaskProcessor.sln --no-restore --configuration Release

      - name: Executar testes
        run: dotnet test TaskProcessor.sln --no-build --configuration Release